<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#5b2c83"/>
  <!-- Clipboard body -->
  <rect x="25" y="28" width="50" height="58" rx="4" fill="#ffffff"/>
  <!-- Clipboard clip -->
  <rect x="38" y="22" width="24" height="12" rx="3" fill="#ffffff"/>
  <rect x="42" y="20" width="16" height="6" rx="2" fill="#5b2c83"/>
  <!-- Checkmark lines (rubric rows) -->
  <line x1="32" y1="46" x2="68" y2="46" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="32" y1="56" x2="68" y2="56" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="32" y1="66" x2="68" y2="66" stroke="#e8ecf4" stroke-width="2"/>
  <!-- Check marks -->
  <polyline points="34,44 37,47 43,41" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,54 37,57 43,51" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,64 37,67 43,61" stroke="#ca8a04" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- AI sparkle -->
  <polygon points="62,38 64,42 68,42 65,45 66,49 62,47 58,49 59,45 56,42 60,42" fill="#ffc107"/>
  <!-- Small text lines (scores) -->
  <line x1="48" y1="46" x2="58" y2="46" stroke="#5b2c83" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="56" x2="55" y2="56" stroke="#5b2c83" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="66" x2="60" y2="66" stroke="#5b2c83" stroke-width="2" stroke-linecap="round"/>
  <!-- AI circuit dots -->
  <circle cx="63" cy="72" r="2.5" fill="#ffc107"/>
  <circle cx="55" cy="76" r="2.5" fill="#ffc107"/>
  <line x1="63" y1="72" x2="55" y2="76" stroke="#ffc107" stroke-width="1.5"/>
</svg>
